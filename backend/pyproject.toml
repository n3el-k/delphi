[project]
name = "backend"
version = "0.1.0"
description = "Hack the Change 2026 API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
